<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" width="1200" height="544" role="img" aria-labelledby="title desc">
<title id="title">How far the protein layer reaches</title>
<desc id="desc">Of 2,437 active MIBiG entries, 452 have gene records and 1,985 don&#x27;t (Phase 3b covers them with MIBiG&#x27;s protein file). Their 4,737 gene records: 4,089 named by an INSDC or RefSeq number, 648 by a locus tag or gene name. Of the 4,089 numbers sent to UniProt, 2,449 were found (2,442 entries) and 1,640 weren&#x27;t. By job: 1,991 build the molecule and get CATALYZES arrows, 522 have other jobs, 2,224 have no job recorded.</desc>
<defs>

</defs>
<rect x="1.0" y="1.0" width="1198.0" height="542.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">How far the protein layer reaches</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">MIBiG 4.0 and UniProt release 2026_03, first run on 2026-10-12. Each bar is its own total.</text><text x="32.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Active MIBiG entries</text><text x="1168.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">2,437</text><rect x="330.0" y="114.0" width="135.3" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="330.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">452 with gene records (19%)</text><rect x="467.3" y="114.0" width="602.7" height="28.0" rx="4" fill="#898781" stroke="none" stroke-width="1.5"/><text x="1070.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">1,985 without: Phase 3b covers them</text><text x="32.0" y="228.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Their gene records</text><text x="1168.0" y="228.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">4,737</text><rect x="330.0" y="210.0" width="636.8" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="330.0" y="260.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">4,089 named by an INSDC or RefSeq number</text><rect x="968.8" y="210.0" width="101.2" height="28.0" rx="4" fill="#898781" stroke="none" stroke-width="1.5"/><text x="1070.0" y="260.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">648 by a locus tag or name: not looked up</text><text x="32.0" y="324.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Numbers sent to UniProt</text><text x="1168.0" y="324.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">4,089</text><rect x="330.0" y="306.0" width="441.2" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="330.0" y="356.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">2,449 found: 2,442 UniProt entries</text><rect x="773.2" y="306.0" width="296.8" height="28.0" rx="4" fill="#898781" stroke="none" stroke-width="1.5"/><text x="1070.0" y="356.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">1,640 not found, all listed</text><text x="32.0" y="420.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Gene records by job</text><text x="1168.0" y="420.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">4,737</text><rect x="330.0" y="402.0" width="309.0" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="330.0" y="452.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">1,991 build the molecule: CATALYZES</text><rect x="641.0" y="402.0" width="79.5" height="28.0" rx="4" fill="#898781" stroke="none" stroke-width="1.5"/><text x="641.0" y="452.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">522 other jobs</text><rect x="722.6" y="402.0" width="347.4" height="28.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="1070.0" y="452.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">2,224 with no job recorded</text><text x="32.0" y="493.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Nothing grey is dropped: every part is counted, and the ids UniProt didn&#x27;t find are listed in uniprot_summary.json.</text><text x="32.0" y="518.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start" font-style="italic">Every gene record becomes a Protein node with an ENCODES arrow, whichever way it is named and whether or not UniProt knows it.</text>
</svg>
