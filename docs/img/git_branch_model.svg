<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title desc">
<title id="title">The three-branch model</title>
<desc id="desc">Work on local develop; one push updates origin develop, beta and master; local master is then fast-forwarded from origin master.</desc>
<defs>
  <marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="998.0" height="418.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Where your work goes: develop, then beta and master</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">You only ever work on develop. One push updates all three branches on GitHub.</text><rect x="32.0" y="100.0" width="330.0" height="230.0" rx="16" fill="#f3f2ee" stroke="#52514e" stroke-width="2"/><text x="197.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">your computer</text><rect x="62.0" y="150.0" width="270.0" height="52.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="197.0" y="173.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">develop</text><text x="197.0" y="192.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">every change happens here</text><rect x="62.0" y="250.0" width="270.0" height="52.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="197.0" y="273.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">master</text><text x="197.0" y="292.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">kept in step, never edited</text><rect x="640.0" y="100.0" width="330.0" height="270.0" rx="16" fill="#f3f2ee" stroke="#52514e" stroke-width="2"/><text x="805.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">GitHub (origin)</text><rect x="670.0" y="146.0" width="270.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="805.0" y="170.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">origin/develop</text><text x="805.0" y="190.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">daily work, backed up</text><path d="M336 176 C470 176 520 174 666 174" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2a78d6)"/><rect x="670.0" y="218.0" width="270.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="805.0" y="242.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">origin/beta</text><text x="805.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">finished phases</text><path d="M336 176 C470 176 520 246 666 246" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2a78d6)"/><rect x="670.0" y="290.0" width="270.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="805.0" y="314.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">origin/master</text><text x="805.0" y="334.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">what visitors see</text><path d="M336 176 C470 176 520 318 666 318" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2a78d6)"/><rect x="376.0" y="92.0" width="250.0" height="48.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="501.0" y="112.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle">git push origin develop</text><text x="501.0" y="130.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle">develop:beta develop:master</text><path d="M666 330 C560 330 470 276 336 276" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-52514e)"/><rect x="376.0" y="334.0" width="250.0" height="26.0" rx="6" fill="#fcfcfb" stroke="none" stroke-width="1.5"/><text x="501.0" y="352.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">git pull --ff-only origin master</text><circle cx="660" cy="394" r="9" fill="#0ca30c"/><path d="M656.0 394.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="676.0" y="399.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">GitHub runs the tests on every push (Actions tab)</text>
</svg>
