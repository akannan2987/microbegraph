<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 390" width="1184" height="390" role="img" aria-labelledby="title desc">
<title id="title">Phase 1 ingestion flow</title>
<desc id="desc">Zenodo to fetch with checksum check, to the evidence locker and provenance log, to the offline tidy with rule checks, to staging tables.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1182.0" height="388.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Phase 1, end to end: from Zenodo to staging tables</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Three commands. Each box is a file or a check you can open and inspect.</text><rect x="32.0" y="150.0" width="200.0" height="132.0" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="132.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">Zenodo</text><text x="132.0" y="212.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">MIBiG 4.0 release</text><text x="132.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">record 14169073</text><text x="132.0" y="256.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">CC BY 4.0</text><line x1="236.0" y1="216.0" x2="258.0" y2="216.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="262.0" y="150.0" width="200.0" height="132.0" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="362.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">fetch</text><text x="362.0" y="212.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">download to .part</text><text x="362.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">verify the MD5</text><text x="362.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">then rename</text><line x1="466.0" y1="216.0" x2="488.0" y2="216.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="492.0" y="150.0" width="200.0" height="132.0" rx="14" fill="#f3f2ee" stroke="#52514e" stroke-width="2"/><text x="592.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">evidence locker</text><text x="592.0" y="212.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">data/raw/mibig/</text><text x="592.0" y="234.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">mibig_json_4.0.tar.gz</text><text x="592.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">never edited</text><line x1="696.0" y1="216.0" x2="718.0" y2="216.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="722.0" y="150.0" width="200.0" height="132.0" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="822.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">tidy (offline)</text><text x="822.0" y="212.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">read every entry</text><text x="822.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">check the 12 rules</text><text x="822.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">then write</text><line x1="926.0" y1="216.0" x2="948.0" y2="216.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="952.0" y="150.0" width="200.0" height="132.0" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="1052.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">staging</text><text x="1052.0" y="212.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">data/processed/staging/</text><text x="1052.0" y="234.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">mibig_nodes.csv</text><text x="1052.0" y="256.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">mibig_edges.csv</text><rect x="34.0" y="92.0" width="224.0" height="44.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="146.0" y="111.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">--probe</text><text x="146.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">asks, downloads nothing</text><rect x="480.0" y="92.0" width="224.0" height="44.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="592.0" y="111.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">--source mibig</text><text x="592.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">fetch + tidy</text><rect x="710.0" y="92.0" width="224.0" height="44.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="822.0" y="111.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">--tidy-only --all</text><text x="822.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">re-run tidy, no network</text><circle cx="290" cy="316" r="10" fill="#0ca30c"/><path d="M285.5 316.0 l3.0 3.5 l6.0 -7.0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="308.0" y="321.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">match: filed</text><circle cx="290" cy="344" r="10" fill="#d03b3b"/><path d="M286.0 340.0 L294.0 348.0 M294.0 340.0 L286.0 348.0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="308.0" y="349.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">mismatch: thrown away</text><rect x="492.0" y="306.0" width="200.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="592.0" y="328.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">provenance.csv</text><text x="592.0" y="348.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">+1 row: what, where, when</text><line x1="592.0" y1="286.0" x2="592.0" y2="302.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="822.0" y="320.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">rule broken? nothing is written,</text><text x="822.0" y="340.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">and the message says which rule</text><text x="1052.0" y="320.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">+ mibig_summary.json</text><text x="1052.0" y="340.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">(the counts)</text>
</svg>
