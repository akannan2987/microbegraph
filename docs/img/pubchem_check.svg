<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 544" width="1060" height="544" role="img" aria-labelledby="title desc">
<title id="title">Is MIBiG&#x27;s PubChem number right?</title>
<desc id="desc">1,186 MIBiG compounds give a PubChem number. With one name on a number, a matching name or formula confirms it: 637 both, 135 name only, 325 formula only, 64 neither and kept apart. With several names on one number, each name must be listed by PubChem: 8 confirmed, 12 not. 5 numbers PubChem doesn&#x27;t have. Examples: erythromycin and erythromycin A joined; bacillomycin D&#x27;s number belongs to Bacillomycin Fc, with a different formula; minutissamides B and C share D&#x27;s number and formula but are different molecules.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1058.0" height="542.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Is MIBiG&#x27;s PubChem number right?</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">A shared number isn&#x27;t enough on its own. A second, independent clue must agree before two records become one node.</text><rect x="32.0" y="96.0" width="300.0" height="60.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="48.0" y="122.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">MIBiG gives a compound a</text><text x="48.0" y="142.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">PubChem number (1,186 compounds)</text><line x1="182.0" y1="162.0" x2="182.0" y2="180.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="182.0" width="620.0" height="118.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="48.0" y="206.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Only one MIBiG name on the number</text><text x="48.0" y="226.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Does PubChem list the name, OR do the formulas agree?</text><circle cx="56" cy="246" r="8" fill="#0ca30c"/><path d="M52.4 246.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72.0" y="250.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">name and formula: 637</text><circle cx="356" cy="246" r="8" fill="#0ca30c"/><path d="M352.4 246.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="372.0" y="250.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">name only: 135</text><circle cx="56" cy="272" r="8" fill="#0ca30c"/><path d="M52.4 272.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72.0" y="276.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">formula only: 325</text><circle cx="356" cy="272" r="8" fill="#d03b3b"/><path d="M352.8 268.8 L359.2 275.2 M359.2 268.8 L352.8 275.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="372.0" y="276.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">neither: 64</text><line x1="182.0" y1="302.0" x2="182.0" y2="320.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="322.0" width="620.0" height="92.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="48.0" y="346.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Several MIBiG names on one number</text><text x="48.0" y="366.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Each name must be one PubChem lists: isomers share formulas</text><circle cx="56" cy="386" r="8" fill="#0ca30c"/><path d="M52.4 386.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72.0" y="390.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">name confirmed: 8</text><circle cx="356" cy="386" r="8" fill="#d03b3b"/><path d="M352.8 382.8 L359.2 389.2 M359.2 382.8 L352.8 389.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="372.0" y="390.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">name not listed: 12</text><line x1="182.0" y1="416.0" x2="182.0" y2="434.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="436.0" width="620.0" height="92.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="48.0" y="460.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">A number PubChem doesn&#x27;t have</text><text x="48.0" y="480.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Nothing to compare with</text><circle cx="56" cy="500" r="8" fill="#d03b3b"/><path d="M52.8 496.8 L59.2 503.2 M59.2 496.8 L52.8 503.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="72.0" y="504.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">kept apart, listed: 5</text><text x="690.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">THREE REAL CASES</text><rect x="690.0" y="122.0" width="340.0" height="84.0" rx="10" fill="#fcfcfb" stroke="#0ca30c" stroke-width="1.8"/><circle cx="712" cy="146" r="9" fill="#0ca30c"/><path d="M708.0 146.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="730.0" y="151.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">erythromycin and erythromycin A</text><text x="708.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">both give CID 12560, and PubChem lists</text><text x="708.0" y="192.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">both names: one node</text><rect x="690.0" y="218.0" width="340.0" height="84.0" rx="10" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.8"/><circle cx="712" cy="242" r="9" fill="#d03b3b"/><path d="M708.4 238.4 L715.6 245.6 M715.6 238.4 L708.4 245.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="730.0" y="247.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">bacillomycin D</text><text x="708.0" y="270.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">gives the number of PubChem&#x27;s &quot;Bacillomycin Fc&quot;:</text><text x="708.0" y="288.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">C49H76N10O15 against C52H84N12O14</text><rect x="690.0" y="314.0" width="340.0" height="84.0" rx="10" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.8"/><circle cx="712" cy="338" r="9" fill="#d03b3b"/><path d="M708.4 334.4 L715.6 341.6 M715.6 334.4 L708.4 341.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="730.0" y="343.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">minutissamides B and C</text><text x="708.0" y="366.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">both give the number of minutissamide D:</text><text x="708.0" y="384.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">same formula, different molecules</text><text x="690.0" y="432.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Kept apart: the MIBiG compound stays as it</text><text x="690.0" y="450.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">was, and its number moves to</text><text x="690.0" y="468.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">pubchem_cid_not_confirmed.</text>
</svg>
