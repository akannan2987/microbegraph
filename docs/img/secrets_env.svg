<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title desc">
<title id="title">Where a key lives</title>
<desc id="desc">The NCBI key sits in .env on your computer, which Git ignores. The program reads it, shows only &#x27;set&#x27;, and sends it to NCBI inside a POST body. GitHub only ever gets .env.example with empty values, and the safety gate stops any push that contains a key.</desc>
<defs>
  <marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
  <marker id="arrow-d03b3b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d03b3b"/></marker>
</defs>
<rect x="1.0" y="1.0" width="998.0" height="518.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Where a key lives, and where it never goes</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">One private file on your computer, one sealed trip to NCBI, and a gate that stops it reaching GitHub.</text><rect x="32.0" y="96.0" width="452.0" height="300.0" rx="16" fill="#f3f2ee" stroke="#52514e" stroke-width="2"/><text x="258.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">your computer</text><rect x="56.0" y="142.0" width="404.0" height="92.0" rx="12" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><path d="M74 160 h14 l6 6 v20 h-20 z" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round"/><path d="M88 160 v6 h6" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round"/><text x="106.0" y="176.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">.env</text><path d="M423 170 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#2a78d6" stroke-width="2.6" stroke-linecap="round"/><rect x="419.0" y="169.0" width="22.0" height="17.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><circle cx="430" cy="177" r="2.4" fill="#fcfcfb"/><text x="74.0" y="206.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">NCBI_API_KEY=a1b2...(36 characters)</text><text x="74.0" y="224.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">listed in .gitignore, so Git never sees it</text><line x1="258.0" y1="238.0" x2="258.0" y2="262.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="56.0" y="266.0" width="404.0" height="110.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="74.0" y="292.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">python -m microbegraph.fetch</text><text x="74.0" y="314.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">reads .env when it starts</text><text x="74.0" y="340.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">on screen:  API key : set</text><text x="74.0" y="362.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">never the key itself</text><line x1="488.0" y1="186.0" x2="690.0" y2="186.0" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/><rect x="571.0" y="148.0" width="36.0" height="24.0" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.2"/><path d="M571 149 L589 162 L607 149" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linejoin="round"/><text x="589.0" y="210.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">POST body (sealed)</text><text x="589.0" y="228.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">id=..., api_key=...</text><rect x="694.0" y="140.0" width="274.0" height="92.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="831.0" y="172.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">NCBI E-utilities</text><text x="831.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">10 requests a second</text><text x="831.0" y="212.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">instead of 3</text><rect x="694.0" y="262.0" width="274.0" height="134.0" rx="16" fill="#f3f2ee" stroke="#52514e" stroke-width="2"/><text x="831.0" y="288.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">GitHub (public)</text><path d="M714 302 h14 l6 6 v20 h-20 z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><path d="M728 302 v6 h6" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><text x="744.0" y="318.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">.env.example</text><text x="744.0" y="336.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">NCBI_API_KEY=   (empty)</text><circle cx="726" cy="368" r="9" fill="#d03b3b"/><path d="M722.4 364.4 L729.6 371.6 M729.6 364.4 L722.4 371.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="744.0" y="373.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">.env, or any key-shaped text</text><path d="M460 330 C560 330 600 360 690 366" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-d03b3b)"/><rect x="500.0" y="340.0" width="178.0" height="26.0" rx="6" fill="#fcfcfb" stroke="none" stroke-width="1.5"/><text x="589.0" y="358.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#d03b3b" text-anchor="middle">check-public-safe.sh</text><text x="589.0" y="384.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">stops the push</text><text x="32.0" y="434.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">THE KEY IS NEVER</text><circle cx="42" cy="460" r="9" fill="#d03b3b"/><path d="M38.4 456.4 L45.6 463.6 M45.6 456.4 L38.4 463.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="58.0" y="465.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">in a web address</text><circle cx="232" cy="460" r="9" fill="#d03b3b"/><path d="M228.4 456.4 L235.6 463.6 M235.6 456.4 L228.4 463.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="248.0" y="465.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">in provenance.csv</text><circle cx="422" cy="460" r="9" fill="#d03b3b"/><path d="M418.4 456.4 L425.6 463.6 M425.6 456.4 L418.4 463.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="438.0" y="465.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">in a manifest</text><circle cx="612" cy="460" r="9" fill="#d03b3b"/><path d="M608.4 456.4 L615.6 463.6 M615.6 456.4 L608.4 463.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="628.0" y="465.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">on screen</text><circle cx="802" cy="460" r="9" fill="#d03b3b"/><path d="M798.4 456.4 L805.6 463.6 M805.6 456.4 L798.4 463.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="818.0" y="465.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">in a commit</text><text x="32.0" y="500.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Without a key everything still works, just more slowly.</text>
</svg>
