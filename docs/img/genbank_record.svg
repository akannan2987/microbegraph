<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-labelledby="title desc">
<title id="title">One gene, as MIBiG&#x27;s GenBank file describes it</title>
<desc id="desc">A real CDS from MIBiG entry BGC0002390: a location that wraps onto two lines, codon_start, db_xref GeneID:100272490, gene LOC100272490, gene_synonym GRMZM2G134862, a note that wraps onto a second line, product translin and protein_id NP_001140431.1. The reader keeps the gene number, the names and the protein number, and skips the rest, including wrapped lines. MIBiG&#x27;s curators remove LOC100272490; the GenBank file ties it to NP_001140431.1, so that protein leaves the cluster.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1198.0" height="632.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">One gene, as MIBiG&#x27;s GenBank file describes it</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">A real CDS feature from entry BGC0002390 (zealexins, maize), without its protein sequence. Each line starting with / is a qualifier.</text><rect x="32.0" y="100.0" width="640.0" height="360.0" rx="10" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><rect x="40.0" y="114.0" width="5.0" height="26.0" rx="2" fill="#52514e" stroke="none" stroke-width="1.5"/><text x="56.0" y="132.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">CDS  complement(join(63720..63793,63898..64033,73837..73862,</text><circle cx="700" cy="127" r="9" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="720.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">where the gene sits</text><text x="912.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">opposite strand, seven pieces</text><rect x="40.0" y="148.0" width="5.0" height="26.0" rx="2" fill="#52514e" stroke="none" stroke-width="1.5"/><text x="93.5" y="166.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">74207..74251,74359..74474,74580..74676,74787..75168))</text><circle cx="700" cy="161" r="9" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="720.0" y="166.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start"></text><text x="720.0" y="166.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">the location wraps onto a second line</text><rect x="40.0" y="182.0" width="5.0" height="26.0" rx="2" fill="#898781" stroke="none" stroke-width="1.5"/><text x="56.0" y="200.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">/codon_start=1</text><circle cx="700" cy="195" r="9" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="720.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">how to start reading the DNA</text><rect x="40.0" y="216.0" width="5.0" height="26.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="56.0" y="234.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">/db_xref=&quot;GeneID:100272490&quot;</text><circle cx="700" cy="229" r="9" fill="#0ca30c"/><path d="M696.0 229.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">NCBI&#x27;s gene number</text><text x="912.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">LOC100272490 is this number</text><rect x="40.0" y="250.0" width="5.0" height="26.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="56.0" y="268.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">/gene=&quot;LOC100272490&quot;</text><circle cx="700" cy="263" r="9" fill="#0ca30c"/><path d="M696.0 263.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720.0" y="268.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">the gene&#x27;s name</text><text x="912.0" y="268.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">what MIBiG&#x27;s curators wrote</text><rect x="40.0" y="284.0" width="5.0" height="26.0" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="56.0" y="302.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">/gene_synonym=&quot;GRMZM2G134862&quot;</text><circle cx="700" cy="297" r="9" fill="#0ca30c"/><path d="M696.0 297.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">another name</text><text x="912.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">split on ; when there are several</text><rect x="40.0" y="318.0" width="5.0" height="26.0" rx="2" fill="#898781" stroke="none" stroke-width="1.5"/><text x="56.0" y="336.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">/note=&quot;Derived by automated computational analysis using</text><circle cx="700" cy="331" r="9" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="720.0" y="336.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">a note</text><rect x="40.0" y="352.0" width="5.0" height="26.0" rx="2" fill="#898781" stroke="none" stroke-width="1.5"/><text x="101.0" y="370.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">gene prediction method: BestRefSeq.&quot;</text><circle cx="700" cy="365" r="9" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="720.0" y="370.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start"></text><text x="720.0" y="370.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">still the note: never read as a name</text><rect x="40.0" y="386.0" width="5.0" height="26.0" rx="2" fill="#52514e" stroke="none" stroke-width="1.5"/><text x="56.0" y="404.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">/product=&quot;translin&quot;</text><circle cx="700" cy="399" r="9" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="720.0" y="404.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">the protein&#x27;s name</text><text x="912.0" y="404.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">the protein file has it too</text><rect x="40.0" y="420.0" width="5.0" height="26.0" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="56.0" y="438.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">/protein_id=&quot;NP_001140431.1&quot;</text><circle cx="700" cy="433" r="9" fill="#0ca30c"/><path d="M696.0 433.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="720.0" y="438.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">the protein&#x27;s number</text><text x="912.0" y="438.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">where every name above leads</text><circle cx="42" cy="476" r="8" fill="#0ca30c"/><path d="M38.4 476.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58.0" y="480.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">read by src/microbegraph/sources/mibig_genbank.py</text><circle cx="420" cy="476" r="8" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="436.0" y="480.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">skipped, wrapped lines included</text><text x="32.0" y="510.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">HOW MICROBEGRAPH USES IT</text><rect x="32.0" y="524.0" width="252.0" height="58.0" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="46.0" y="548.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">MIBiG&#x27;s curators remove</text><text x="46.0" y="570.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">&quot;LOC100272490&quot;</text><line x1="286.0" y1="553.0" x2="318.0" y2="553.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="322.0" y="524.0" width="252.0" height="58.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="336.0" y="548.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the GenBank file</text><text x="336.0" y="570.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">GeneID:100272490</text><line x1="576.0" y1="553.0" x2="608.0" y2="553.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="612.0" y="524.0" width="252.0" height="58.0" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><text x="626.0" y="548.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">names the protein</text><text x="626.0" y="570.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">NP_001140431.1</text><line x1="866.0" y1="553.0" x2="898.0" y2="553.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="902.0" y="524.0" width="252.0" height="58.0" rx="10" fill="#fcfcfb" stroke="#0ca30c" stroke-width="2"/><text x="916.0" y="548.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">so the cluster loses it</text><text x="916.0" y="570.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">removal 4 of 4</text><text x="32.0" y="610.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The same lookup gives the 59 gene records named only by a gene name (baeI, agqA, SCO6265...) their protein numbers.</text>
</svg>
