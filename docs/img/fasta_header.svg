<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="title desc">
<title id="title">Reading one protein from MIBiG&#x27;s protein file</title>
<desc id="desc">The header BGC0000433.5|c1|8558-19312|+|CAE02630.1|surfactin_synthetase_A|CAE02630.1 has seven parts: entry and version, record, position, strand, label, product and protein number, followed by the 3,584-letter sequence. Part 6 names the node ncbiprotein:CAE02630.1, part 0 is the cluster that encodes it, part 4 is kept as a locus tag when it differs, part 5 as the product, parts 2 and 3 as the location, and the sequence as its length and MD5 fingerprint.</desc>
<defs>

</defs>
<rect x="1.0" y="1.0" width="1198.0" height="626.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Reading one protein from MIBiG&#x27;s protein file</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Each protein is two lines in a FASTA file: a header with seven parts, then its sequence, one letter per amino acid.</text><text x="32.0" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">&gt;</text><rect x="46.0" y="120.0" width="121.4" height="40.0" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="106.7" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">BGC0000433.5</text><circle cx="106.7" cy="104" r="11" fill="#2a78d6"/><text x="106.7" y="108.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcfcfb" text-anchor="middle">0</text><text x="106.7" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">entry and version</text><text x="173.4" y="147.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#898781" text-anchor="middle">|</text><rect x="179.4" y="120.0" width="36.9" height="40.0" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="197.8" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">c1</text><circle cx="197.8" cy="104" r="11" fill="#898781"/><text x="197.8" y="108.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcfcfb" text-anchor="middle">1</text><text x="197.8" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">record</text><text x="222.3" y="147.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#898781" text-anchor="middle">|</text><rect x="228.3" y="120.0" width="104.5" height="40.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="280.5" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">8558-19312</text><circle cx="280.5" cy="104" r="11" fill="#52514e"/><text x="280.5" y="108.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcfcfb" text-anchor="middle">2</text><text x="280.5" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">position</text><text x="338.8" y="147.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#898781" text-anchor="middle">|</text><rect x="344.8" y="120.0" width="28.4" height="40.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="359.0" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">+</text><circle cx="359.0" cy="104" r="11" fill="#52514e"/><text x="359.0" y="108.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcfcfb" text-anchor="middle">3</text><text x="359.0" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">strand</text><text x="379.2" y="147.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#898781" text-anchor="middle">|</text><rect x="385.2" y="120.0" width="104.5" height="40.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="437.5" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">CAE02630.1</text><circle cx="437.5" cy="104" r="11" fill="#52514e"/><text x="437.5" y="108.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcfcfb" text-anchor="middle">4</text><text x="437.5" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">label</text><text x="495.7" y="147.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#898781" text-anchor="middle">|</text><rect x="501.7" y="120.0" width="205.9" height="40.0" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="604.7" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">surfactin_synthetase_A</text><circle cx="604.7" cy="104" r="11" fill="#52514e"/><text x="604.7" y="108.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcfcfb" text-anchor="middle">5</text><text x="604.7" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">product</text><text x="713.6" y="147.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#898781" text-anchor="middle">|</text><rect x="719.6" y="120.0" width="104.5" height="40.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><text x="771.9" y="146.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">CAE02630.1</text><circle cx="771.9" cy="104" r="11" fill="#eb6834"/><text x="771.9" y="108.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fcfcfb" text-anchor="middle">6</text><text x="771.9" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">protein number</text><rect x="46.0" y="200.0" width="1122.0" height="36.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><text x="60.0" y="224.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">MEITFYPLTNAQKRIWYTEKFYPNTSISNLAGFGKLISEDGVQAHYVEKAIQEFVRRYES...</text><text x="1154.0" y="224.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="end">3,584 letters</text><text x="32.0" y="272.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">WHAT MICROBEGRAPH KEEPS</text><rect x="32.0" y="288.0" width="1136.0" height="42.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="52" cy="309" r="6" fill="#eb6834"/><text x="68.0" y="314.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">part 6</text><text x="170.0" y="314.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">names the node</text><text x="440.0" y="314.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">ncbiprotein:CAE02630.1</text><text x="740.0" y="314.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">or mg.protein:&lt;entry&gt;-&lt;name&gt; when it isn&#x27;t a number</text><rect x="32.0" y="338.0" width="1136.0" height="42.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="52" cy="359" r="6" fill="#2a78d6"/><text x="68.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">part 0</text><text x="170.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">the cluster that ENCODES it</text><text x="440.0" y="364.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">mibig:BGC0000433</text><text x="740.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">version 5, the same as the JSON entry</text><rect x="32.0" y="388.0" width="1136.0" height="42.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="52" cy="409" r="6" fill="#52514e"/><text x="68.0" y="414.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">part 4</text><text x="170.0" y="414.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">locus_tags, when it isn&#x27;t part 6</text><text x="440.0" y="414.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">TSTA_117750 (for EED18001.1)</text><text x="740.0" y="414.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">a genome&#x27;s own label for the gene</text><rect x="32.0" y="438.0" width="1136.0" height="42.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="52" cy="459" r="6" fill="#52514e"/><text x="68.0" y="464.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">part 5</text><text x="170.0" y="464.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">product, with _ back to spaces</text><text x="440.0" y="464.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">surfactin synthetase A</text><text x="740.0" y="464.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">a gene record&#x27;s own product wins</text><rect x="32.0" y="488.0" width="1136.0" height="42.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="52" cy="509" r="6" fill="#52514e"/><text x="68.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">parts 2, 3</text><text x="170.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">locations</text><text x="440.0" y="514.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">BGC0000433:8558-19312:+</text><text x="740.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">one per place the file lists it</text><rect x="32.0" y="538.0" width="1136.0" height="42.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="52" cy="559" r="6" fill="#52514e"/><text x="68.0" y="564.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">sequence</text><text x="170.0" y="564.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">sequence_length and sequence_md5</text><text x="440.0" y="564.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">3584, f8ecefd278c1a5e6...</text><text x="740.0" y="564.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">the letters stay in the file in the locker</text><text x="32.0" y="602.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Part 1 is always c1 in MIBiG 4.0 (each entry has one sequence record), so it isn&#x27;t kept.</text>
