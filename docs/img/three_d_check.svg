206.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">so the rule would keep that number. A review</text><text x="800.0" y="226.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">gives L-alanine (S), as in CID 6857732,</text><text x="800.0" y="246.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">so a decision by hand joins 6857732.</text><text x="32.0" y="300.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">WHAT THE RESOLVER DOES WITH EACH PAIR (183 IN THE REAL DATA)</text><rect x="32.0" y="316.0" width="250.0" height="80.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/><text x="48.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">A pair for clue 2</text><text x="48.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">MIBiG&#x27;s number and the name&#x27;s</text><text x="48.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">record share one skeleton</text><rect x="322.0" y="316.0" width="250.0" height="80.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/><text x="338.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Compare the 3D detail</text><text x="338.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">every chiral centre (R or S) and</text><text x="338.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">double bond (E or Z) both describe</text><rect x="322.0" y="448.0" width="250.0" height="80.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/><text x="338.0" y="474.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Ask MIBiG&#x27;s own structure</text><text x="338.0" y="496.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the SMILES in MIBiG&#x27;s entry,</text><text x="338.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">compared with both records</text><line x1="282.0" y1="356.0" x2="318.0" y2="356.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><line x1="572.0" y1="356.0" x2="608.0" y2="356.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><line x1="447.0" y1="396.0" x2="447.0" y2="444.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="458.0" y="426.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start" paint-order="stroke" stroke="#fcfcfb" stroke-width="5">65 differ</text><rect x="612.0" y="316.0" width="556.0" height="80.0" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><circle cx="636" cy="356.0" r="9" fill="#0ca30c"/><path d="M632.0 356.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="656.0" y="352.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">118 agree: clue 2 counts</text><text x="656.0" y="371.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">joined, unless another candidate is just as good (valclavam&#x27;s two numbers tie)</text><rect x="612.0" y="432.0" width="556.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><circle cx="636" cy="460.0" r="9" fill="#0ca30c"/><path d="M632.0 460.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="656.0" y="456.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">38 match MIBiG&#x27;s number: it stands</text><text x="656.0" y="475.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">n-myristoyl-D-asparagine keeps 102500690 (R, the D form)</text><rect x="612.0" y="498.0" width="556.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="636" cy="526.0" r="9" fill="#0ca30c"/><path d="M632.0 526.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="656.0" y="522.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">17 match the name&#x27;s record: the compound moves there</text><text x="656.0" y="541.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">macbecin II moves to 5778325, &quot;Macbecin II&quot;</text><rect x="612.0" y="564.0" width="556.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><circle cx="636" cy="592.0" r="9" fill="#898781"/><path d="M636 587.0 L636 592.0 L640.0 594.7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="656.0" y="588.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">10 can&#x27;t be decided: neither record joins</text><text x="656.0" y="607.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">9 compounds wait for a person (recipe R24); kosinostatin&#x27;s other number joined</text><path d="M572 488 C 592 488, 590 460, 608 460" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-52514e)"/><path d="M572 488 C 592 488, 590 526, 608 526" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-52514e)"/><path d="M572 488 C 592 488, 590 592, 608 592" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-52514e)"/><text x="32.0" y="656.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Compounds with a PubChem record: 1,975 became 1,967. Ties for a person: 35 became 34 (the check settled kosinostatin&#x27;s). Echinomycin, decided by hand, isn&#x27;t one of the 183.</text><text x="32.0" y="678.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Counts from the build of 2026-10-13 after Phase 4c. Details in docs/06c-checking-3d-detail.md.</text>
