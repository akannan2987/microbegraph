<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 702" width="1200" height="702" role="img" aria-labelledby="title desc">
<title id="title">Checking the 3D detail of a shared skeleton</title>
<desc id="desc">Echinomycin&#x27;s two PubChem records share a skeleton. The 8 chiral centres both describe read R R R S R R R S in CID 458034, a number MIBiG gives, and S R R S R S R S in CID 6857732, PubChem&#x27;s Echinomycin: 6 agree and 2 differ, at the two alanines, so they are two stereoisomers. MIBiG&#x27;s own structure matches CID 458034, but a review gives L-alanine (S), as in CID 6857732, so a decision by hand joins that record. For each of the 183 pairs clue 2 looks at, the resolver compares the 3D detail. 118 agree and clue 2 counts. 65 differ, and MIBiG&#x27;s own structure decides: 38 match MIBiG&#x27;s number (n-myristoyl-D-asparagine keeps 102500690), 17 match the record PubChem names (macbecin II moves to 5778325), and 10 can&#x27;t be decided, leaving 9 compounds for a person. Compounds with a PubChem record went from 1,975 to 1,967, and ties for a person from 35 to 34.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1198.0" height="700.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Checking the 3D detail of a shared skeleton</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Two PubChem records can share a skeleton and still be different compounds. The resolver compares them place by place before trusting clue 2.</text><text x="32.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">ECHINOMYCIN: ONE SKELETON, TWO DRAWINGS, THE 8 CHIRAL CENTRES BOTH DESCRIBE</text><text x="32.0" y="144.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">CID 458034</text><text x="32.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">a number MIBiG gives</text><circle cx="290" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="290.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">R</text><circle cx="352" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="352.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">R</text><circle cx="414" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="414.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">R</text><circle cx="476" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="476.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">S</text><circle cx="538" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="538.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">R</text><circle cx="600" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="600.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">R</text><circle cx="662" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="662.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">R</text><circle cx="724" cy="146" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="724.0" y="152.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">S</text><text x="32.0" y="228.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">CID 6857732</text><text x="32.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">PubChem&#x27;s &quot;Echinomycin&quot;</text><circle cx="290" cy="230" r="20" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><text x="290.0" y="236.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle"