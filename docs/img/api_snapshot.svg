<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-labelledby="title desc">
<title id="title">An API answer kept as evidence</title>
<desc id="desc">PubChem&#x27;s answers are saved byte for byte in a dated folder with a manifest written last, each answer gets a provenance row, and tidy reads the newest finished folder.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1198.0" height="550.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">An answer from an API, kept as evidence</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Answers change from day to day, so every fetch gets its own dated folder, and nothing in it is ever edited.</text><rect x="32.0" y="110.0" width="196.0" height="120.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="130.0" y="142.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">PubChem</text><text x="130.0" y="166.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">24 questions,</text><text x="130.0" y="184.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">100 compounds each,</text><text x="130.0" y="202.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">paced under its limit</text><line x1="232.0" y1="170.0" x2="290.0" y2="170.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="294.0" y="96.0" width="420.0" height="268.0" rx="14" fill="#f3f2ee" stroke="#52514e" stroke-width="2"/><text x="314.0" y="124.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">data/raw/pubchem/2026-10-12T055202Z/</text><path d="M314 146 h14 l6 6 v20 h-20 z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><path d="M328 146 v6 h6" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><text x="344.0" y="163.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">properties_001.json</text><text x="556.0" y="163.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">answer 1, as it arrived</text><path d="M314 184 h14 l6 6 v20 h-20 z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><path d="M328 184 v6 h6" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><text x="344.0" y="201.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">synonyms_001.json</text><text x="556.0" y="201.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">answer 2</text><text x="330.0" y="240.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#898781" text-anchor="start">...</text><path d="M314 260 h14 l6 6 v20 h-20 z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><path d="M328 260 v6 h6" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><text x="344.0" y="277.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">synonyms_012.json</text><text x="556.0" y="277.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">answer 24</text><rect x="310.0" y="300.0" width="388.0" height="50.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><path d="M324 312 h14 l6 6 v20 h-20 z" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round"/><path d="M338 312 v6 h6" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round"/><text x="354.0" y="322.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">manifest.json</text><text x="354.0" y="340.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">what was asked; written LAST, so it marks &#x27;finished&#x27;</text><line x1="718.0" y1="230.0" x2="774.0" y2="230.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="778.0" y="186.0" width="390.0" height="88.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="798.0" y="214.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">provenance.csv</text><text x="798.0" y="238.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">+1 row for every answer: when, from where,</text><text x="798.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">size, and its SHA-256 fingerprint</text><text x="32.0" y="410.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">THE SHELF OVER TIME: tidy reads the newest FINISHED folder</text><rect x="32.0" y="424.0" width="364.0" height="76.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="56" cy="450" r="10" fill="#0ca30c"/><path d="M51.5 450.0 l3.0 3.5 l6.0 -7.0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76.0" y="455.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">2026-10-12T055202Z</text><text x="52.0" y="484.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">finished</text><rect x="412.0" y="424.0" width="364.0" height="76.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="436" cy="450" r="10" fill="#d03b3b"/><path d="M432.0 446.0 L440.0 454.0 M440.0 446.0 L432.0 454.0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="456.0" y="455.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">2026-10-12T091510Z</text><text x="432.0" y="484.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">no manifest: the line dropped, so tidy skips it</text><rect x="792.0" y="424.0" width="364.0" height="76.0" rx="12" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><circle cx="816" cy="450" r="10" fill="#0ca30c"/><path d="M811.5 450.0 l3.0 3.5 l6.0 -7.0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="836.0" y="455.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">2026-11-03T074005Z</text><text x="812.0" y="484.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">finished, newest: tidy reads this one</text><text x="32.0" y="532.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Same questions on the same day? The fetch reuses today&#x27;s folder and asks nothing. A new day, or new questions, makes a new folder.</text>
</svg>
