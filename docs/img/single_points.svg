<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 646" width="1200" height="646" role="img" aria-labelledby="title desc">
<title id="title">What each crop&#x27;s leads rest on</title>
<desc id="desc">Cotton has 3 leads (Pseudomonas protegens Pf-5 and Pseudomonas sp. M18 with pyoluteorin, Pseudomonas chlororaphis with pyrrolnitrin), 2 compounds and 2 papers. Jujube has 1 lead (FZB42, surfactin), maize 1 (FZB42, bacillomycin D), each resting on one compound and one paper. Melon has 2 leads (FZB42 with fengycin, Bacillus subtilis with iturin), 2 compounds and 1 paper. Wheat has 2 leads (FZB42 with bacillomycin D, Pseudomonas fluorescens with 2,4-diacetylphloroglucinol from two clusters), 2 compounds and 2 papers. Without Bacillus velezensis FZB42, 4 of the 9 leads are lost and jujube and maize have none.</desc>
<defs>

</defs>
<rect x="1.0" y="1.0" width="1198.0" height="644.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">What each crop&#x27;s leads rest on</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">A lead is one microbe, one compound, one pathogen and one crop. A fact every path of a lead uses is a single point of failure.</text><text x="32.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">CROP</text><text x="140.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">LEADS (MICROBE AND COMPOUND)</text><text x="1000.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="middle">COMPOUNDS</text><text x="1110.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="middle">PAPERS</text><rect x="24.0" y="124.0" width="1152.0" height="112.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><g transform="translate(35.0,135.0) scale(0.458)"><path d="M24 45 V22" stroke="#eda100" stroke-width="3" stroke-linecap="round"/><path d="M24 26 C10 26 6 16 6 8 C16 8 24 13 24 26 z" fill="#eda100"/><path d="M24 31 C38 31 42 21 42 13 C32 13 24 18 24 31 z" fill="#eda100" opacity=".8"/></g><text x="64.0" y="151.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">cotton</text><rect x="140.0" y="134.0" width="820.0" height="26.0" rx="13" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/>