<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 488" width="1150" height="488" role="img" aria-labelledby="title desc">
<title id="title">Seven jobs a gene can have in MIBiG</title>
<desc id="desc">Scaffold biosynthesis 964, Tailoring 629, Precursor biosynthesis 398 (these three give CATALYZES arrows); Regulation 231, Transport 167, Activation / processing 81, Resistance/immunity 43 (ENCODES only). Counts are jobs recorded in MIBiG 4.0.</desc>
<defs>

</defs>
<rect x="1.0" y="1.0" width="1148.0" height="486.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Seven jobs a gene can have in MIBiG</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Only the first three carry out a step in making the molecule, so only they give a CATALYZES arrow.</text><text x="32.0" y="126.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Scaffold biosynthesis</text><rect x="250.0" y="110.0" width="330.0" height="24.0" rx="5" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="588.0" y="127.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">964</text><text x="650.0" y="127.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">builds the backbone of the molecule</text><rect x="990.0" y="108.0" width="126.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="1002.0" cy="119.8" r="5" fill="#eb6834"/><text x="1012.0" y="122.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">CATALYZES</text><text x="32.0" y="172.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Tailoring</text><rect x="250.0" y="156.0" width="215.3" height="24.0" rx="5" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="473.3" y="173.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">629</text><text x="650.0" y="173.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">changes the backbone once it exists</text><rect x="990.0" y="154.0" width="126.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="1002.0" cy="165.8" r="5" fill="#eb6834"/><text x="1012.0" y="168.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">CATALYZES</text><text x="32.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Precursor biosynthesis</text><rect x="250.0" y="202.0" width="136.2" height="24.0" rx="5" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="394.2" y="219.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">398</text><text x="650.0" y="219.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">makes a building block the backbone needs</text><rect x="990.0" y="200.0" width="126.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="1002.0" cy="211.8" r="5" fill="#eb6834"/><text x="1012.0" y="214.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">CATALYZES</text><text x="32.0" y="264.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Regulation</text><rect x="250.0" y="248.0" width="79.1" height="24.0" rx="5" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="337.1" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">231</text><text x="650.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">switches the cluster on or off</text><rect x="990.0" y="246.0" width="126.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="1002.0" cy="257.8" r="5" fill="#c3c2b7"/><text x="1012.0" y="260.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">ENCODES only</text><text x="32.0" y="310.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Transport</text><rect x="250.0" y="294.0" width="57.2" height="24.0" rx="5" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="315.2" y="311.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">167</text><text x="650.0" y="311.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">carries the finished molecule out of the cell</text><rect x="990.0" y="292.0" width="126.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="1002.0" cy="303.8" r="5" fill="#c3c2b7"/><text x="1012.0" y="306.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">ENCODES only</text><text x="32.0" y="356.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Activation / processing</text><rect x="250.0" y="340.0" width="27.7" height="24.0" rx="5" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="285.7" y="357.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">81</text><text x="650.0" y="357.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">switches the big enzymes on so they can work</text><rect x="990.0" y="338.0" width="126.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="1002.0" cy="349.8" r="5" fill="#c3c2b7"/><text x="1012.0" y="352.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">ENCODES only</text><text x="32.0" y="402.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Resistance/immunity</text><rect x="250.0" y="386.0" width="14.7" height="24.0" rx="5" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="272.7" y="403.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="start">43</text><text x="650.0" y="403.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">protects the cell from its own product</text><rect x="990.0" y="384.0" width="126.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="1002.0" cy="395.8" r="5" fill="#c3c2b7"/><text x="1012.0" y="398.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">ENCODES only</text><text x="32.0" y="440.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Counts: jobs recorded across the 452 MIBiG 4.0 entries that have gene records (one gene can have more than one job).</text><text x="32.0" y="466.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">On a car assembly line, the first three build the car; the other four keep the line running.</text>
</svg>
