<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" width="1000" height="534" role="img" aria-labelledby="title desc">
<title id="title">Which UniProt entry is this protein?</title>
<desc id="desc">Of 20,671 protein numbers UniProt found, 20,589 have one entry and join it. 82 have several: 33 are decided by the cluster&#x27;s organism, 2 more by sequence length, 5 more by review status, and 42 stay on their own. 278 entries no number chose are left out of the graph.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="998.0" height="532.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Which UniProt entry is this protein?</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">UniProt lists each protein number under one or more entries. One entry joins at once; several need a reason to pick one.</text><rect x="32.0" y="96.0" width="300.0" height="96.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="48.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">20,671 protein numbers</text><text x="48.0" y="146.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">found in UniProt (release 2026_03)</text><text x="48.0" y="172.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">UniProt&#x27;s own cross-reference</text><line x1="332.0" y1="128.0" x2="380.0" y2="128.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="388.0" y="100.0" width="300.0" height="56.0" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="410" cy="128" r="9" fill="#eb6834"/><path d="M405.9 128.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="428.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">one entry: joins it</text><text x="428.0" y="144.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">20,589 numbers</text><line x1="182.0" y1="192.0" x2="182.0" y2="226.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="196.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">several entries: 82 numbers</text><rect x="32.0" y="234.0" width="656.0" height="60.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="58" cy="264" r="14" fill="#eb6834"/><text x="58.0" y="269.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fcfcfb" text-anchor="middle">1</text><text x="84.0" y="260.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">the entry for the cluster&#x27;s organism</text><text x="84.0" y="280.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">WP_012444311.1 &gt; Q8KWW8</text><text x="672.0" y="270.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">33 joined</text><rect x="32.0" y="306.0" width="656.0" height="60.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="58" cy="336" r="14" fill="#eb6834"/><text x="58.0" y="341.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fcfcfb" text-anchor="middle">2</text><text x="84.0" y="332.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">of those, the one as long as MIBiG&#x27;s sequence</text><text x="84.0" y="352.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">NP_851152.1 &gt; F4K051</text><text x="672.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">2 joined</text><rect x="32.0" y="378.0" width="656.0" height="60.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="58" cy="408" r="14" fill="#eb6834"/><text x="58.0" y="413.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fcfcfb" text-anchor="middle">3</text><text x="84.0" y="404.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">of those, the one a curator reviewed</text><text x="84.0" y="424.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">XP_001798919.1 &gt; Q0UI04</text><text x="672.0" y="414.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">5 joined</text><rect x="32.0" y="450.0" width="656.0" height="60.0" rx="10" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.8"/><circle cx="58" cy="480" r="11" fill="#d03b3b"/><path d="M53.6 475.6 L62.4 484.4 M62.4 475.6 L53.6 484.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="84.0" y="476.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">still not one: the number stays on its own</text><text x="84.0" y="496.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">26 with no entry for the organism, 16 with equal ties</text><text x="672.0" y="486.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">42 kept apart</text><text x="720.0" y="250.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Several numbers can choose one entry:</text><text x="720.0" y="268.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">the same protein submitted twice.</text><text x="720.0" y="286.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">It becomes one node, encoded by</text><text x="720.0" y="304.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">every cluster that lists it.</text><text x="720.0" y="340.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">An entry no number chooses is left</text><text x="720.0" y="358.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">out of the graph (278 entries), and</text><text x="720.0" y="376.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">the ledger says which numbers</text><text x="720.0" y="394.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">led to it.</text>
</svg>
