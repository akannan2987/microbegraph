<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="title desc">
<title id="title">How far the protein layer reaches now</title>
<desc id="desc">Phase 3 against Phase 3b: active entries with proteins 452 against 2,437; Protein nodes 4,737 against 40,037; ENCODES arrows 4,737 against 40,048; numbers sent to UniProt 4,089 against 39,053; numbers UniProt found 2,449 against 20671; CATALYZES arrows 4,492 in both.</desc>
<defs>

</defs>
<rect x="1.0" y="1.0" width="1198.0" height="608.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">How far the protein layer reaches now</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Phase 3 read MIBiG&#x27;s gene records; Phase 3b adds MIBiG&#x27;s protein file. Each row has its own scale.</text><rect x="330.0" y="88.0" width="220.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="342.0" cy="99.8" r="5" fill="#c3c2b7"/><text x="352.0" y="102.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Phase 3: gene records only</text><rect x="564.0" y="88.0" width="250.0" height="23.5" rx="11.75" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="576.0" cy="99.8" r="5" fill="#eb6834"/><text x="586.0" y="102.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Phase 3b: with the protein file</text><text x="32.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Active entries with proteins</text><text x="32.0" y="170.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">all 2,437 active entries</text><rect x="330.0" y="136.0" width="111.3" height="18.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="449.3" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">452</text><rect x="330.0" y="160.0" width="600.0" height="18.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="938.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">2,437</text><text x="32.0" y="224.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Protein nodes</text><text x="32.0" y="244.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">39,053 with an INSDC or RefSeq number</text><rect x="330.0" y="210.0" width="71.0" height="18.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="409.0" y="224.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">4,737</text><rect x="330.0" y="234.0" width="600.0" height="18.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="938.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">40,037</text><text x="32.0" y="298.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">ENCODES arrows</text><text x="32.0" y="318.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">11 proteins sit in two clusters</text><rect x="330.0" y="284.0" width="71.0" height="18.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="409.0" y="298.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">4,737</text><rect x="330.0" y="308.0" width="600.0" height="18.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="938.0" y="322.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">40,048</text><text x="32.0" y="372.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Numbers sent to UniProt</text><text x="32.0" y="392.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">10,000 per job: still 5 jobs</text><rect x="330.0" y="358.0" width="62.8" height="18.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="400.8" y="372.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">4,089</text><rect x="330.0" y="382.0" width="600.0" height="18.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="938.0" y="396.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">39,053</text><text x="32.0" y="446.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Numbers UniProt found</text><text x="32.0" y="466.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">the rest are listed, not dropped</text><rect x="330.0" y="432.0" width="71.1" height="18.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="409.1" y="446.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">2,449</text><rect x="330.0" y="456.0" width="600.0" height="18.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="938.0" y="470.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">20,671</text><text x="32.0" y="520.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">CATALYZES arrows</text><text x="32.0" y="540.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">unchanged: only gene records give jobs</text><rect x="330.0" y="506.0" width="600.0" height="18.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/><text x="938.0" y="520.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">4,492</text><rect x="330.0" y="530.0" width="600.0" height="18.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="938.0" y="544.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">4,492</text><text x="32.0" y="584.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">MIBiG 4.0 (fixed by the pins); UniProt 2026_03. UniProt&#x27;s numbers can move a little with each release.</text>
