<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" role="img" aria-labelledby="title desc">
<title id="title">The evidence ladder</title>
<desc id="desc">Four evidence levels from curated_experimental (strongest) to inferred (a hypothesis), each with meaning, example and how to treat it.</desc>
<defs>
  <marker id="arrow-184f95" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#184f95"/></marker>
  <marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
  <marker id="arrow-6da7ec" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6da7ec"/></marker>
  <marker id="arrow-898781" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#898781"/></marker>
</defs>
<rect x="1.0" y="1.0" width="978.0" height="488.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">The four evidence levels, strongest first</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Every arrow carries one. A chain of arrows is only as strong as its weakest link.</text><rect x="32.0" y="100.0" width="916.0" height="74.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="60.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#184f95" text-anchor="start">1</text><line x1="96.0" y1="138.0" x2="196.0" y2="138.0" stroke="#184f95" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-184f95)"/><text x="220.0" y="130.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">curated_experimental</text><text x="220.0" y="154.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">A curator recorded a published experiment</text><text x="560.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">e.g. MIBiG: this cluster makes surfactin</text><text x="560.0" y="154.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">use: treat as a measured fact</text><rect x="32.0" y="188.0" width="916.0" height="74.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="60.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="start">2</text><line x1="96.0" y1="226.0" x2="196.0" y2="226.0" stroke="#2a78d6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/><text x="220.0" y="218.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">database_assertion</text><text x="220.0" y="242.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">A public database states it</text><text x="560.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">e.g. PubChem formula; MIBiG activity without a reference</text><text x="560.0" y="242.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">use: reliable reference data</text><rect x="32.0" y="276.0" width="916.0" height="74.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="60.0" y="306.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#6da7ec" text-anchor="start">3</text><line x1="96.0" y1="314.0" x2="196.0" y2="314.0" stroke="#6da7ec" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-6da7ec)"/><text x="220.0" y="306.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">curated_literature</text><text x="220.0" y="330.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">This project&#x27;s own cited reading of a paper</text><text x="560.0" y="306.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">e.g. surfactin INHIBITS Botrytis cinerea (with DOI)</text><text x="560.0" y="330.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">use: trust it, check the citation</text><rect x="32.0" y="364.0" width="916.0" height="74.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="60.0" y="394.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#898781" text-anchor="start">4</text><line x1="96.0" y1="402.0" x2="196.0" y2="402.0" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-898781)"/><text x="220.0" y="394.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">inferred</text><text x="220.0" y="418.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Produced by an algorithm in this repository</text><text x="560.0" y="394.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">e.g. a link predicted in Phase 7</text><text x="560.0" y="418.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">use: a hypothesis, never a finding</text><text x="32.0" y="470.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Line weight and dashes repeat the level, so it never depends on colour.</text>
</svg>
