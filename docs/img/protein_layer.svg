<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 742" width="1200" height="742" role="img" aria-labelledby="title desc">
<title id="title">The protein layer</title>
<desc id="desc">Bacillus velezensis FZB42 harbors cluster BGC0000433, which encodes the enzyme srfAA (CAE02630.1), which catalyzes a step in making surfactin; the direct PRODUCES arrow from Phase 1 stays as a shortcut. UniProt&#x27;s ID mapping says CAE02630.1 is entry Q70KJ7, Surfactin synthetase A. Of the nine gene records in the surfactin entry, the three scaffold genes get a CATALYZES arrow and the other six get ENCODES only. From Phase 3b the protein file adds the cluster&#x27;s other 14 proteins, with ENCODES only.</desc>
