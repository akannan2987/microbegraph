<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 528" width="1000" height="528" role="img" aria-labelledby="title desc">
<title id="title">What GitHub does with your code</title>
<desc id="desc">A push to master, the Run workflow button or a pull request starts a run. ci.yml sends one copy to each of seven machines: Ubuntu Linux, Windows and macOS with Python 3.11 and 3.12, and a RHEL 8 container with Python 3.11. Each one gets the code, installs Python and the project, runs ruff and then pytest.</desc>
<defs>
  <marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
  <marker id="arrow-c3c2b7" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3c2b7"/></marker>
</defs>
<rect x="1.0" y="1.0" width="998.0" height="526.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">What GitHub does with your code</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Seven fresh computers install MicrobeGraph from nothing and run the same checks you run at home.</text><rect x="32.0" y="100.0" width="236.0" height="150.0" rx="12" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1.5"/><text x="48.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">A RUN STARTS WHEN</text><circle cx="54" cy="146" r="4" fill="#2a78d6"/><text x="66.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">master changes</text><text x="66.0" y="166.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">your end-of-phase push</text><circle cx="54" cy="182" r="4" fill="#2a78d6"/><text x="66.0" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">you click Run workflow</text><text x="66.0" y="202.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">on the Actions tab</text><circle cx="54" cy="218" r="4" fill="#2a78d6"/><text x="66.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">a pull request opens</text><text x="66.0" y="238.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">someone proposes a change</text><line x1="272.0" y1="175.0" x2="314.0" y2="175.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/><rect x="318.0" y="135.0" width="150.0" height="80.0" rx="12" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><text x="393.0" y="168.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">ci.yml</text><text x="393.0" y="190.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">the instructions</text><line x1="472.0" y1="175.0" x2="498.0" y2="175.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-2a78d6)"/><text x="393.0" y="238.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">one copy goes to</text><text x="393.0" y="253.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">each of the seven</text><rect x="506.0" y="96.0" width="225.0" height="46.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="519.0" y="107.0" width="26.0" height="18.0" rx="3" fill="none" stroke="#52514e" stroke-width="2.5"/><path d="M532 125 V130 M525 130 H539" stroke="#52514e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="556.0" y="116.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Ubuntu Linux</text><text x="556.0" y="133.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weigh