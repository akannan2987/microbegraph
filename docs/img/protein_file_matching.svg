<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" width="1200" height="578" role="img" aria-labelledby="title desc">
<title id="title">Every cluster&#x27;s proteins, in three steps</title>
<desc id="desc">Step 1 leaves out the proteins MIBiG&#x27;s curators removed: 18 found by number, gene name in the product, or NCBI gene number inside the product; 4 removals name genes the file doesn&#x27;t show. Step 2 matches each gene record: 4,661 by number or label, 17 by a single matching product, 59 not in the file. Step 3 adds every other protein. From 46,987 proteins in the file: minus 6,978 in pending entries, minus 18 removed, minus 2 repeats, plus 59 gene records not in the file, gives 40,048 ENCODES arrows to 40,037 Protein nodes.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1198.0" height="576.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Every cluster&#x27;s proteins, in three steps</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">For each active entry, the curators&#x27; notes in the JSON are lined up with the proteins the file lists.</text><rect x="32.0" y="96.0" width="356.0" height="320.0" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="58" cy="124" r="14" fill="#eb6834"/><text x="58.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fcfcfb" text-anchor="middle">1</text><text x="82.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Leave out the curators&#x27; removals</text><rect x="422.0" y="96.0" width="356.0" height="320.0" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="448" cy="124" r="14" fill="#eb6834"/><text x="448.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fcfcfb" text-anchor="middle">2</text><text x="472.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Match each gene record</text><rect x="812.0" y="96.0" width="356.0" height="320.0" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="838" cy="124" r="14" fill="#eb6834"/><text x="838.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fcfcfb" text-anchor="middle">3</text><text x="862.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Add every other protein</text><line x1="392.0" y1="256.0" x2="418.0" y2="256.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><line x1="782.0" y1="256.0" x2="808.0" y2="256.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="52.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">&quot;to_delete&quot; in the JSON, looked up among</text><text x="52.0" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the same entry&#x27;s proteins:</text><rect x="52.0" y="196.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="68" cy="217" r="8" fill="#d03b3b"/><path d="M64.8 213.8 L71.2 220.2 M71.2 213.8 L64.8 220.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="84.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">by number</text><text x="84.0" y="231.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">AFD30968.1</text><text x="358.0" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">4</text><rect x="52.0" y="244.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="68" cy="265" r="8" fill="#d03b3b"/><path d="M64.8 261.8 L71.2 268.2 M71.2 261.8 L64.8 268.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="84.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">by product</text><text x="84.0" y="279.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">CrmK = CrmK</text><text x="358.0" y="271.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">2</text><rect x="52.0" y="292.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="68" cy="313" r="8" fill="#d03b3b"/><path d="M64.8 309.8 L71.2 316.2 M71.2 309.8 L64.8 316.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="84.0" y="310.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">by word in product</text><text x="84.0" y="327.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">LOC100273419 (8 isoforms)</text><text x="358.0" y="319.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">12</text><text x="52.0" y="358.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">18 proteins left out, each listed with</text><text x="52.0" y="376.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">the curators&#x27; reason. 4 removals name</text><text x="52.0" y="394.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">genes the file doesn&#x27;t show: listed.</text><text x="442.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Each of the 4,737 gene records is looked</text><text x="442.0" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">up the same way (a product only if unique):</text><rect x="442.0" y="196.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="458" cy="217" r="8" fill="#0ca30c"/><path d="M454.4 217.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="474.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">by number or label</text><text x="474.0" y="231.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">TSTA_117750 &gt; EED18001.1</text><text x="748.0" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">4,661</text><rect x="442.0" y="244.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="458" cy="265" r="8" fill="#0ca30c"/><path d="M454.4 265.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="474.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">by one product</text><text x="474.0" y="279.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">nisA = NisA &gt; ADJ56352.1</text><text x="748.0" y="271.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">17</text><rect x="442.0" y="292.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="458" cy="313" r="7" fill="none" stroke="#c3c2b7" stroke-width="2"/><text x="474.0" y="310.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">not in the file</text><text x="474.0" y="327.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">baeB, mscA, ...</text><text x="748.0" y="319.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">59</text><text x="442.0" y="358.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Found: the node takes the file&#x27;s number,</text><text x="442.0" y="376.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">so 452 locus tags and names gain one.</text><text x="442.0" y="394.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Not found: kept as in Phase 3, listed.</text><text x="832.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Each remaining protein becomes a</text><text x="832.0" y="180.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Protein node with an ENCODES arrow.</text><rect x="832.0" y="196.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="848" cy="217" r="8" fill="#eb6834"/><path d="M844.4 217.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="864.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">same protein as a gene record</text><text x="864.0" y="231.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">one node, one arrow</text><rect x="832.0" y="244.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="848" cy="265" r="8" fill="#eb6834"/><path d="M844.4 265.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="864.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">same protein twice in a cluster</text><text x="864.0" y="279.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">one node, both positions</text><rect x="832.0" y="292.0" width="316.0" height="42.0" rx="8" fill="#f3f2ee" stroke="none" stroke-width="1.5"/><circle cx="848" cy="313" r="8" fill="#eb6834"/><path d="M844.4 313.0 l2.4 2.8 l4.8 -5.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="864.0" y="310.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">same protein in two clusters</text><text x="864.0" y="327.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">one node, two arrows</text><text x="832.0" y="358.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">The 661 genes the curators added</text><text x="832.0" y="376.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">(&quot;to_add&quot;) are already in the file, with</text><text x="832.0" y="394.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">sequences, and arrive here.</text><text x="32.0" y="448.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">THE REAL NUMBERS, MIBiG 4.0</text><rect x="32.0" y="462.0" width="154.0" height="66.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="109.0" y="492.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">46,987</text><text x="109.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">proteins in the file</text><rect x="194.0" y="462.0" width="154.0" height="66.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="271.0" y="492.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#52514e" text-anchor="middle">- 6,978</text><text x="271.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">in 199 pending entries</text><rect x="356.0" y="462.0" width="154.0" height="66.0" rx="10" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.5"/><text x="433.0" y="492.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#d03b3b" text-anchor="middle">- 18</text><text x="433.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">removed by curators</text><rect x="518.0" y="462.0" width="154.0" height="66.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="595.0" y="492.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#52514e" text-anchor="middle">- 2</text><text x="595.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">repeats in one cluster</text><rect x="680.0" y="462.0" width="154.0" height="66.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="757.0" y="492.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#52514e" text-anchor="middle">+ 59</text><text x="757.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">gene records not in the file</text><rect x="842.0" y="462.0" width="154.0" height="66.0" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><text x="919.0" y="492.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eb6834" text-anchor="middle">= 40,048</text><text x="919.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">ENCODES arrows</text><rect x="1004.0" y="462.0" width="180.0" height="66.0" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><text x="1094.0" y="492.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eb6834" text-anchor="middle">40,037</text><text x="1094.0" y="514.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">Protein nodes</text><text x="32.0" y="556.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">40,048 arrows but 40,037 nodes: 11 proteins are encoded by two clusters each. CATALYZES still comes only from gene records.</text>
