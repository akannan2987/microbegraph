family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">recorded as reviewed_by_hand</text><rect x="32.0" y="416.0" width="1136.0" height="58.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="48.0" y="441.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">activity words meaning the same</text><text x="48.0" y="460.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">antitumor, anticancer...</text><line x1="398.0" y1="445.0" x2="436.0" y2="445.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="446.0" y="424.0" width="352.0" height="42.0" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="464" cy="445" r="6" fill="#eb6834"/><text x="478.0" y="441.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">activity_synonyms.csv</text><text x="478.0" y="458.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">4 rows, each with a source</text><line x1="800.0" y1="445.0" x2="834.0" y2="445.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><circle cx="856" cy="445" r="10" fill="#0ca30c"/><path d="M851.5 445.0 l3.0 3.5 l6.0 -7.0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="876.0" y="441.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">74 activities became 70</text><text x="876.0" y="460.0" font-family="system