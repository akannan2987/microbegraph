<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 678" width="1200" height="678" role="img" aria-labelledby="title desc">
<title id="title">Closing the gaps Phase 4 left</title>
<desc id="desc">Seven gaps Phase 4 left and what closed each one. MIBiG&#x27;s GenBank file placed all 59 gene records named only by a gene name, and the 4 genes the curators removed. Every value MIBiG&#x27;s entries disagree on is now kept with its entry: 278 on 120 nodes. The review file keeps two wrong joins apart with five decisions, each with a source. Four activity words are folded, so 74 activities became 70. PubChem&#x27;s name search, done in PubChem&#x27;s names file, cut the joins on the formula alone from 322 to 82 and found 865 compounds with no number by name. Of 42 protein numbers with tied UniProt entries, one is decided by hand, one left with a removed protein, and 40 are still open. The circular import is fixed.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1198.0" height="676.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Closing the gaps Phase 4 left</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Phase 4&#x27;s rules refused every join they couldn&#x27;t confirm and listed what was left. Phase 4b works through that list.</text><rect x="32.0" y="86.0" width="120.5" height="24.0" rx="12.0" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="44.0" cy="98.0" r="5" fill="#2a78d6"/><text x="54.0" y="101.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">more evidence</text><rect x="168.5" y="86.0" width="162.2" height="24.0" rx="12.0" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="180.5" cy="98.0" r="5" fill="#1baf7a"/><text x="190.5" y="101.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">nothing thrown away</text><rect x="346.7" y="86.0" width="162.2" height="24.0" rx="12.0" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="358.7" cy="98.0" r="5" fill="#eb6834"/><text x="368.7" y="101.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">a person&#x27;s decision</text><text x="42.0" y="140.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">WHAT PHASE 4 LEFT</text><text x="452.0" y="140.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">WHAT CLOSED IT</text>