ple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">40 still open</text><text x="32.0" y="632.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Also fixed: a circular import (two files that each needed the other to load). The shared table helpers moved to src/microbegraph/tables.py.</text><text x="32.0" y="654.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Counts from the build of 2026-10-12, after PubChem&#x27;s name search in its names file.</text>
