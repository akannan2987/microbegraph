<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 678" width="1060" height="678" role="img" aria-labelledby="title desc">
<title id="title">Four clues for a compound&#x27;s PubChem number</title>
<desc id="desc">Four clues, strongest first. 1, name: PubChem lists MIBiG&#x27;s name under the number, 785 joins. 2, same structure: the name is filed under another record with the same first InChIKey block, 182 joins. 3, name search: the name is found under exactly one number with an agreeing formula, 928 joins. 4, formula alone: 82 joins, switched off when the name search points at a different molecule or MIBiG&#x27;s entries disagree about the formula, as for 2-methylisoborneol, ferrichrome and lasalocid. A person&#x27;s decision comes first; ties stay apart; shared numbers need clue 1.</desc>
<defs>

</defs>
<rect x="1.0" y="1.0" width="1058.0" height="676.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Four clues for a compound&#x27;s PubChem number</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Every number MIBiG gives, and every number PubChem&#x27;s name search finds, is a candidate. The strongest clue present decides.</text><rect x="32.0" y="98.0" width="760.0" height="76.0" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="3.4"/><circle cx="62" cy="136" r="18" fill="#1baf7a" opacity="1.00"/><text x="62.0" y="142.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fcfcfb" text-anchor="middle">1</text><text x="94.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">name</text><text x="94.0" y="144.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">MIBiG gives the number, and PubChem lists MIBiG&#x27;s name under it</text><text x="94.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">(its title or any of its names), or the name search returns that very number</text><text x="808.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">785 joins on 2026-10-12</text><text x="808.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">erythromycin A and CID 12560</text><rect x="32.0" y="186.0" width="760.0" height="76.0" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2.8"/><circle cx="62" cy="224" r="18" fill="#1baf7a" opacity="0.85"/><text x="62.0" y="230.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fcfcfb" text-anchor="middle">2</text><text x="94.0" y="212.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">same structure</text><text x="94.0" y="232.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">MIBiG gives the number; PubChem files the name under another</text><text x="94.0" y="250.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">record with the same first InChIKey block: the same molecule, drawn another way</text><text x="808.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">182 joins on 2026-10-12</text><text x="808.0" y="238.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">with or without its 3D shape</text><rect x="32.0" y="274.0" width="760.0" height="76.0" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2.2"/><circle cx="62" cy="312" r="18" fill="#1baf7a" opacity="0.70"/><text x="62.0" y="318.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fcfcfb" text-anchor="middle">3</text><text x="94.0" y="300.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">name search</text><text x="94.0" y="320.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">MIBiG gives no number that passes 1 or 2, but the name search finds</text><text x="94.0" y="338.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the name under exactly one number whose formula agrees with MIBiG&#x27;s</text><text x="808.0" y="306.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">928 joins on 2026-10-12</text><text x="808.0" y="326.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">for the 1,254 with a formula, no number</text><rect x="32.0" y="362.0" width="760.0" height="76.0" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.6"/><circle cx="62" cy="400" r="18" fill="#1baf7a" opacity="0.55"/><text x="62.0" y="406.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fcfcfb" text-anchor="middle">4</text><text x="94.0" y="388.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">formula alone</text><text x="94.0" y="408.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">MIBiG gives one number and the formulas agree; nothing above</text><text x="94.0" y="426.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">points elsewhere. The weakest clue, so two things switch it off:</text><text x="808.0" y="394.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">82 joins on 2026-10-12</text><text x="808.0" y="414.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">R19 lists them</text><rect x="94.0" y="450.0" width="698.0" height="48.0" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.6"/><circle cx="116" cy="474" r="9" fill="#d03b3b"/><path d="M112.4 470.4 L119.6 477.6 M119.6 470.4 L112.4 477.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="134.0" y="470.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">the name search files the name under a different molecule</text><text x="134.0" y="488.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">2-methylisoborneol: its MIBiG number is a bromine compound&#x27;s</text><rect x="94.0" y="506.0" width="698.0" height="48.0" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.6"/><circle cx="116" cy="530" r="9" fill="#d03b3b"/><path d="M112.4 526.4 L119.6 533.6 M119.6 526.4 L112.4 533.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="134.0" y="526.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">MIBiG&#x27;s entries disagree about the formula</text><text x="134.0" y="544.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">ferrichrome (with and without iron), lasalocid (salt and acid)</text><circle cx="40" cy="574" r="3" fill="#52514e"/><text x="52.0" y="578.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Before any clue: a person&#x27;s decision in the review file wins, and says so.</text><circle cx="40" cy="596" r="3" fill="#52514e"/><text x="52.0" y="600.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Two candidates equally strong and different: kept apart, both named in the ledger.</text><circle cx="40" cy="618" r="3" fill="#52514e"/><text x="52.0" y="622.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">A number several MIBiG compounds share: clue 1 only (isomers share formulas).</text><circle cx="40" cy="640" r="3" fill="#52514e"/><text x="52.0" y="644.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The ledger names the clue that decided: &quot;Confirmed by name.&quot;, &quot;Confirmed by the formula alone.&quot;</text>
</svg>
