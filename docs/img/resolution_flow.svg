<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 476" width="1040" height="476" role="img" aria-labelledby="title desc">
<title id="title">From six sources to one graph</title>
<desc id="desc">Six staging tables (72,092 node rows, 70,613 identifiers) go through the organism, compound and protein rules. The resolver writes nodes.csv (48,264 nodes), edges.csv (57,012 arrows) and the ledger (23,989 decisions), checks the twelve rules, and the build loads the result into DuckDB and NetworkX with matching counts.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1038.0" height="474.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">From six sources to one graph</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">The resolver decides which records are the same thing, writes every decision down, and the build loads the result twice.</text><text x="32.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">1  SIX SOURCES&#x27; TABLES</text><rect x="32.0" y="120.0" width="220.0" height="40.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="36.0" y="127.0" width="32.0" height="26.0" rx="3" fill="none" stroke="#52514e" stroke-width="3"/><line x1="36" y1="136" x2="68" y2="136" stroke="#52514e" stroke-width="3"/><line x1="36" y1="145" x2="68" y2="145" stroke="#52514e" stroke-width="2"/><line x1="49" y1="127" x2="49" y2="153" stroke="#52514e" stroke-width="2"/><text x="74.0" y="145.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">mibig</text><text x="240.0" y="145.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">47,907</text><rect x="32.0" y="170.0" width="220.0" height="40.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="36.0" y="177.0" width="32.0" height="26.0" rx="3" fill="none" stroke="#52514e" stroke-width="3"/><line x1="36" y1="186" x2="68" y2="186" stroke="#52514e" stroke-width="3"/><line x1="36" y1="195" x2="68" y2="195" stroke="#52514e" stroke-width="2"/><line x1="49" y1="177" x2="49" y2="203" stroke="#52514e" stroke-width="2"/><text x="74.0" y="195.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">pubchem</text><text x="240.0" y="195.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">1,171</text><rect x="32.0" y="220.0" width="220.0" height="40.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="36.0" y="227.0" width="32.0" height="26.0" rx="3" fill="none" stroke="#52514e" stroke-width="3"/><line x1="36" y1="236" x2="68" y2="236" stroke="#52514e" stroke-width="3"/><line x1="36" y1="245" x2="68" y2="245" stroke="#52514e" stroke-width="2"/><line x1="49" y1="227" x2="49" y2="253" stroke="#52514e" stroke-width="2"/><text x="74.0" y="245.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">ncbi_taxonomy</text><text x="240.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">2,457</text><rect x="32.0" y="270.0" width="220.0" height="40.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="36.0" y="277.0" width="32.0" height="26.0" rx="3" fill="none" stroke="#52514e" stroke-width="3"/><line x1="36" y1="286" x2="68" y2="286" stroke="#52514e" stroke-width="3"/><line x1="36" y1="295" x2="68" y2="295" stroke="#52514e" stroke-width="2"/><line x1="49" y1="277" x2="49" y2="303" stroke="#52514e" stroke-width="2"/><text x="74.0" y="295.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">kegg</text><text x="240.0" y="295.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">39</text><rect x="32.0" y="320.0" width="220.0" height="40.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="36.0" y="327.0" width="32.0" height="26.0" rx="3" fill="none" stroke="#52514e" stroke-width="3"/><line x1="36" y1="336" x2="68" y2="336" stroke="#52514e" stroke-width="3"/><line x1="36" y1="345" x2="68" y2="345" stroke="#52514e" stroke-width="2"/><line x1="49" y1="327" x2="49" y2="353" stroke="#52514e" stroke-width="2"/><text x="74.0" y="345.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">uniprot</text><text x="240.0" y="345.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">20,507</text><rect x="32.0" y="370.0" width="220.0" height="40.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="36.0" y="377.0" width="32.0" height="26.0" rx="3" fill="none" stroke="#52514e" stroke-width="3"/><line x1="36" y1="386" x2="68" y2="386" stroke="#52514e" stroke-width="3"/><line x1="36" y1="395" x2="68" y2="395" stroke="#52514e" stroke-width="2"/><line x1="49" y1="377" x2="49" y2="403" stroke="#52514e" stroke-width="2"/><text x="74.0" y="395.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">curation</text><text x="240.0" y="395.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">11</text><text x="32.0" y="440.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">72,092 node rows for</text><text x="32.0" y="458.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">70,613 identifiers</text><text x="300.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">2  THE RULES, IN ORDER</text><rect x="300.0" y="120.0" width="330.0" height="96.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="300.0" y="120.0" width="6.0" height="96.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="320.0" y="146.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Organisms</text><text x="320.0" y="170.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">same identifier, several sources: 1,478</text><text x="320.0" y="189.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">NCBI&#x27;s merged numbers moved: 7</text><text x="320.0" y="208.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">organism and pathogen: 2</text><rect x="300.0" y="230.0" width="330.0" height="96.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="300.0" y="230.0" width="6.0" height="96.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1.5"/><text x="320.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Compounds</text><text x="320.0" y="280.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">PubChem number confirmed: 1,105</text><text x="320.0" y="299.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">kept apart: 81 (names or formulas)</text><text x="320.0" y="318.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">same NPAtlas number and formula: 3</text><rect x="300.0" y="340.0" width="330.0" height="96.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><rect x="300.0" y="340.0" width="6.0" height="96.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="320.0" y="366.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Proteins</text><text x="320.0" y="390.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">UniProt entry joined: 20,629</text><text x="320.0" y="409.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">same sequence, same organism: 220</text><text x="320.0" y="428.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">gene name confirmed by UniProt: 38</text><text x="300.0" y="458.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Anything the evidence can&#x27;t settle stays apart.</text><line x1="258.0" y1="290.0" x2="292.0" y2="290.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><line x1="636.0" y1="290.0" x2="670.0" y2="290.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="680.0" y="108.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">3  WHAT IT WRITES</text><rect x="680.0" y="120.0" width="330.0" height="48.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><path d="M694 130 h14 l6 6 v20 h-20 z" fill="#f3f2ee" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><path d="M708 130 v6 h6" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><text x="722.0" y="141.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">nodes.csv</text><text x="722.0" y="159.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">48,264 nodes</text><rect x="680.0" y="178.0" width="330.0" height="48.0" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><path d="M694 188 h14 l6 6 v20 h-20 z" fill="#f3f2ee" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><path d="M708 188 v6 h6" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><text x="722.0" y="199.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">edges.csv</text><text x="722.0" y="217.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">57,012 arrows</text><rect x="680.0" y="236.0" width="330.0" height="48.0" rx="8" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><path d="M694 246 h14 l6 6 v20 h-20 z" fill="#f3f2ee" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><path d="M708 246 v6 h6" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><text x="722.0" y="257.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">resolution_ledger.csv</text><text x="722.0" y="275.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">23,989 decisions, each with grounds</text><text x="680.0" y="314.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">the twelve rules run again: all pass</text><circle cx="990" cy="310" r="9" fill="#0ca30c"/><path d="M986.0 310.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="845.0" y1="324.0" x2="845.0" y2="350.0" stroke="#52514e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="680.0" y="356.0" width="160.0" height="70.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="760.0" y="384.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">DuckDB</text><text x="760.0" y="406.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">tables, for SQL</text><rect x="850.0" y="356.0" width="160.0" height="70.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><text x="930.0" y="384.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">NetworkX</text><text x="930.0" y="406.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">a graph, for walking</text><text x="680.0" y="452.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="1