<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="title desc">
<title id="title">How a checksum works</title>
<desc id="desc">The published MD5 matches an intact download and differs completely from a download with one damaged byte.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="998.0" height="348.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">A checksum is a fingerprint of a file</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Change one byte anywhere and the fingerprint changes completely.</text><rect x="32.0" y="100.0" width="270.0" height="50.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><path d="M50 112 h16 l8 8 v18 h-24 z" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/><text x="84.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">the file Zenodo published</text><line x1="306.0" y1="125.0" x2="352.0" y2="125.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="329.0" y="117.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#898781" text-anchor="middle">MD5</text><rect x="356.0" y="106.0" width="330.0" height="38.0" rx="8" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1.5"/><text x="521.0" y="130.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="middle">ce1736f4fac7168d85dae3b37c77d3d2</text><text x="700.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">listed on the record page</text><rect x="32.0" y="170.0" width="270.0" height="50.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><path d="M50 182 h16 l8 8 v18 h-24 z" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/><text x="84.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">your download, intact</text><line x1="306.0" y1="195.0" x2="352.0" y2="195.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="329.0" y="187.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#898781" text-anchor="middle">MD5</text><rect x="356.0" y="176.0" width="330.0" height="38.0" rx="8" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1.5"/><text x="521.0" y="200.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="middle">ce1736f4fac7168d85dae3b37c77d3d2</text><circle cx="714" cy="195" r="11" fill="#0ca30c"/><path d="M709.0 195.0 l3.3 3.8 l6.6 -7.7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="734.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">identical: filed in the locker</text><rect x="32.0" y="240.0" width="270.0" height="50.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><path d="M50 252 h16 l8 8 v18 h-24 z" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/><text x="84.0" y="270.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">your download, one byte damaged</text><line x1="306.0" y1="265.0" x2="352.0" y2="265.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><text x="329.0" y="257.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#898781" text-anchor="middle">MD5</text><rect x="356.0" y="246.0" width="330.0" height="38.0" rx="8" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1.5"/><text x="521.0" y="270.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#d03b3b" text-anchor="middle">8f04c1aa9be03d6e1c7f52d0b9e4a611</text><circle cx="714" cy="265" r="11" fill="#d03b3b"/><path d="M709.6 260.6 L718.4 269.4 M718.4 260.6 L709.6 269.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="734.0" y="270.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">different: thrown away</text><text x="32.0" y="330.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Like counting a parcel against its packing slip before you sign for it.</text>
</svg>
