<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="title desc">
<title id="title">The adapter contract</title>
<desc id="desc">Six data sources plug into one socket that requires three functions: probe, fetch and tidy.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1098.0" height="458.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="32.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">One socket, many plugs: the adapter contract</text><text x="32.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Every source fits the same three verbs, so adding one changes nothing downstream.</text><rect x="32.0" y="104.0" width="210.0" height="40.0" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="50.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">MIBiG</text><text x="228.0" y="129.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">Phase 1</text><line x1="242.0" y1="124.0" x2="318.0" y2="252.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="158.0" width="210.0" height="40.0" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="50.0" y="183.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">PubChem</text><text x="228.0" y="183.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">Phase 2</text><line x1="242.0" y1="178.0" x2="318.0" y2="252.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="212.0" width="210.0" height="40.0" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="50.0" y="237.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">NCBI Taxonomy</text><text x="228.0" y="237.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">Phase 2</text><line x1="242.0" y1="232.0" x2="318.0" y2="252.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="266.0" width="210.0" height="40.0" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="50.0" y="291.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">KEGG</text><text x="228.0" y="291.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">Phase 2</text><line x1="242.0" y1="286.0" x2="318.0" y2="252.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="320.0" width="210.0" height="40.0" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="50.0" y="345.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">curated bridge</text><text x="228.0" y="345.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">Phase 2</text><line x1="242.0" y1="340.0" x2="318.0" y2="252.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="32.0" y="374.0" width="210.0" height="40.0" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="50.0" y="399.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">UniProt</text><text x="228.0" y="399.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">Phase 3</text><line x1="242.0" y1="394.0" x2="318.0" y2="252.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="322.0" y="168.0" width="196.0" height="168.0" rx="18" fill="#f3f2ee" stroke="#52514e" stroke-width="2"/><text x="420.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">the socket</text><text x="420.0" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">sources/base.py</text><rect x="366.0" y="262.0" width="14.0" height="34.0" rx="4" fill="#52514e" stroke="none" stroke-width="1.5"/><rect x="404.0" y="262.0" width="14.0" height="34.0" rx="4" fill="#52514e" stroke="none" stroke-width="1.5"/><rect x="442.0" y="262.0" width="14.0" height="34.0" rx="4" fill="#52514e" stroke="none" stroke-width="1.5"/><text x="420.0" y="318.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">probe · fetch · tidy</text><line x1="518.0" y1="252.0" x2="586.0" y2="152.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="590.0" y="108.0" width="480.0" height="88.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="634" cy="152" r="28" fill="#f3f2ee"/><circle cx="630" cy="148" r="11" fill="none" stroke="#2a78d6" stroke-width="3.5"/><line x1="638" y1="156" x2="648" y2="166" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/><text x="680.0" y="138.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">probe()</text><text x="770.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start" font-style="italic">What is out there?</text><text x="680.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">asks about version, size, limits and keys;</text><text x="680.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">downloads nothing</text><line x1="518.0" y1="252.0" x2="586.0" y2="260.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="590.0" y="216.0" width="480.0" height="88.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="634" cy="260" r="28" fill="#f3f2ee"/><path d="M634 246 V266 M626 258 L634 266 L642 258" stroke="#2a78d6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M619 264 V274 H649 V264" stroke="#2a78d6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="680.0" y="246.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">fetch()</text><text x="770.0" y="246.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start" font-style="italic">Bring it home, untouched.</text><text x="680.0" y="270.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">into data/raw/&lt;source&gt;/, fingerprinted,</text><text x="680.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">one provenance row for every file</text><line x1="518.0" y1="252.0" x2="586.0" y2="368.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="590.0" y="324.0" width="480.0" height="88.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="634" cy="368" r="28" fill="#f3f2ee"/><rect x="618.0" y="355.0" width="32.0" height="26.0" rx="3" fill="none" stroke="#2a78d6" stroke-width="3"/><line x1="618" y1="364" x2="650" y2="364" stroke="#2a78d6" stroke-width="3"/><line x1="618" y1="373" x2="650" y2="373" stroke="#2a78d6" stroke-width="2"/><line x1="631" y1="355" x2="631" y2="381" stroke="#2a78d6" stroke-width="2"/><text x="680.0" y="354.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">tidy()</text><text x="770.0" y="354.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start" font-style="italic">Make it fit the rulebook.</text><text x="680.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">reads only the locker, never the internet;</text><text x="680.0" y="398.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">writes staging CSVs that pass the 12 rules</text><text x="32.0" y="440.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">All six are built (Phases 1-3). A new source is one more plug.</text>
</svg>
