<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1086 446" width="1086" height="446" role="img" aria-labelledby="title desc">
<title id="title">Two shapes of the same facts</title>
<desc id="desc">Left, DuckDB tables: four rows of the edges table for the chain from Bacillus velezensis FZB42 to jujube, and a SQL query. Right, the same four arrows as a NetworkX graph from FZB42 through the surfactin cluster, surfactin and Botrytis cinerea to jujube, found with shortest_path. Both hold 48,264 nodes and 57,012 arrows.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
<rect x="1.0" y="1.0" width="1084.0" height="444.0" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
