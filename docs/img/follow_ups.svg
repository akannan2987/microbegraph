<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 686" width="1200" height="686" role="img" aria-labelledby="title desc">
<title id="title">Four follow-ups after the real run</title>
<desc id="desc">Four small changes after Phase 4b&#x27;s real run, before and after. 1: 17 MIBiG entries list two PubChem numbers for one compound, such as BGC0000900 with 644246 and 90658043; only the first was read, and now both are candidates, so round 1 asks about 1,209 numbers instead of 1,193. 2: ferrichrome was joined to 644246, a laboratory tracer with radioactive iron-55; clue 2 now reads the isotope label in the SMILES, and ferrichrome joins 121489511. 3: 409 ledger sentences had nothing in their brackets; they now name the compound whose name search found the record and where it went. 4: 5 KEGG maps stayed as lone dots; they are left out with a ledger row, so Pathway nodes went from 53 to 48. Ferrichrome, psymberin and echinomycin moved to another record; valclavam, corallopyronin and glidobactin wait for a person; epoxomicin and mureidomycin B were settled by hand. Compounds with a PubChem record went from 1,978 to 1,975, joins on the formula alone from 82 to 80, decisions by hand from 5 to 7.</desc>
<defs>
  <marker id="arrow-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
</defs>
