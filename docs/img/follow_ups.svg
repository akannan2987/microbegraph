ff" stroke-width="2.2" stroke-linecap="round"/><text x="342.0" y="242.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">joined 644246, &quot;[55Fe] Ferrichrome&quot;</text><text x="342.0" y="266.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">a laboratory tracer with radioactive iron</text><line x1="706.0" y1="250.0" x2="752.0" y2="250.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="760.0" y="212.0" width="408.0" height="76.0" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/><circle cx="782" cy="250" r="9" fill="#0ca30c"/><path d="M778.0 250.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="802.0" y="242.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">joins 121489511, &quot;Ferrichrome&quot;</text><text x="802.0" y="266.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">clue 2 reads [55Fe+3] in the SMILES</text><circle cx="52" cy="346" r="16" fill="#eb6834"/><text x="52.0" y="351.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fcfcfb" text-anchor="middle">3</text><text x="80.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Whose search was it?</text><text x="80.0" y="362.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the ledger&#x27;s sentence</text><rect x="300.0" y="308.0" width="400.0" height="76.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/><circle cx="322" cy="346" r="9" fill="#d03b3b"/><path d="M318.4 342.4 L325.6 349.6 M325.6 342.4 L318.4 349.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="342.0" y="338.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">(; see their pubchem_number rows)</text><text x="342.0" y="362.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">409 records, nothing in the brackets</text><line x1="706.0" y1="346.0" x2="752.0" y2="346.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-52514e)"/><rect x="760.0" y="308.0" width="408.0" height="76.0" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="782" cy="346" r="9" fill="#0ca30c"/><path d="M778.0 346.0 l2.7 3.1 l5.4 -6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="802.0" y="338.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">found this record for &#x27;tiacumicin B&#x27;</text><text x="802.0" y="362.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">names the compound and where it went</text><circle cx="52" cy="442" r="16" fill="#898781"/><text x="52.0" y="447.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fcfcfb" text-anchor="middle">4</text><text x="80.0" y="438.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill=