ont-size="12" font-weight="700" fill="#898781" text-anchor="start">WHAT IT CHANGED, COMPOUND BY COMPOUND</text><rect x="32.0" y="524.0" width="200.0" height="24.0" rx="12.0" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="44.0" cy="536.0" r="5" fill="#1baf7a"/><text x="54.0" y="539.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">moved to another record</text><text x="248.0" y="540.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">ferrichrome to 121489511, psymberin to 11692946, echinomycin to 458034</text><rect x="32.0" y="558.0" width="200.0" height="24.0" rx="12.0" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="44.0" cy="570.0" r="5" fill="#898781"/><text x="54.0" y="573.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">waits for a person</text><text x="248.0" y="574.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">valclavam (two numbers tie), corallopyronin and glidobactin (no name confirms)</text><rect x="32.0" y="592.0" width="200.0" height="24.0" rx="12.0" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><circle cx="44.0" cy="604.0" r="5" fill="#eb6834"/><text x="54.0" y="607.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">settled by hand</text><text x="248.0" y="608.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">epoxomicin (11226684) and mureidomycin B (101627952): two records with the name</text><text x="32.0" y="640.0" 